          hostedClusters: { type: All }
          workloads:
          - resource: deployments
            name: kube-apiserver
            resourcePolicy:
              containerPolicies:
              - containerName: kube-apiserver
  - name: When minReplicas is set with updateMode Off it should pass
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        profiles:
        - name: base
          hostedClusters: { type: All }
          workloads:
          - resource: deployments
            name: kube-apiserver
            updatePolicy: { updateMode: "Off", minReplicas: 3 }
  - name: When minAllowed equals maxAllowed it should pass
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        profiles:
        - name: base
          hostedClusters: { type: All }
          workloads:
          - resource: deployments
            name: kube-apiserver
            resourcePolicy:
              containerPolicies:
              - containerName: kube-apiserver
                minAllowed: { cpu: "1", memory: 1Gi }
                maxAllowed: { cpu: 1000m, memory: 1024Mi }
  - name: When a Deployment and a StatefulSet have the same name it should pass
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
