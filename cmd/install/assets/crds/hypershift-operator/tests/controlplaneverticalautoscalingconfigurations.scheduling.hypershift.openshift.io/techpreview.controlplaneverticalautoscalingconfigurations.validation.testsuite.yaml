apiVersion: apiextensions.k8s.io/v1
name: "ControlPlaneVerticalAutoscalingConfiguration validation"
crdName: controlplaneverticalautoscalingconfigurations.scheduling.hypershift.openshift.io
version: v1alpha1
tests:
  onCreate:
  # --- Valid configurations ---
  - name: When a full configuration is created it should pass
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        hostedClusters:
          type: Selector
          selector:
            matchExpressions:
            - key: example.com/autoscaled
              operator: Exists
        profiles:
        - name: base
          hostedClusters:
            type: All
          allWorkloads:
            updatePolicy:
              updateMode: InPlaceOrRecreate
              minReplicas: 1
          workloads:
          - resource: deployments
            name: kube-apiserver
            updatePolicy:
              minReplicas: 2
            resourcePolicy:
              containerPolicies:
              - containerName: kube-apiserver
                minAllowed:
                  cpu: 500m
                  memory: 2Gi
                maxAllowed:
                  cpu: "14"
                  memory: 56Gi
          - resource: statefulsets
            name: etcd
            updatePolicy:
              updateMode: Recreate
            resourcePolicy:
              containerPolicies:
              - containerName: etcd
                maxAllowed:
                  memory: 32Gi
        - name: warmup
          hostedClusters:
            type: Selector
            selector:
              matchLabels:
                example.com/warmup: "true"
              matchExpressions:
              - key: example.com/tier
                operator: DoesNotExist
          workloads:
          - resource: deployments
            name: kube-apiserver
            resourcePolicy:
              containerPolicies:
              - containerName: kube-apiserver
                minAllowed:
                  memory: 8Gi
        - name: tier-large
          hostedClusters:
            type: Selector
            selector:
              matchExpressions:
              - key: example.com/tier
                operator: In
                values: ["large", "xlarge"]
          workloads:
          - resource: deployments
            name: kube-apiserver
            resourcePolicy:
              containerPolicies:
              - containerName: kube-apiserver
                minAllowed:
                  memory: 24Gi
                maxAllowed:
                  memory: 112Gi
        - name: paused
          hostedClusters:
            type: Selector
            selector:
              matchLabels:
                control-plane-autoscaling-paused: "true"
          allWorkloads:
            updatePolicy:
              updateMode: Initial
  - name: When hostedClusters is omitted it should pass
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        profiles:
        - name: base
          hostedClusters: { type: All }
          allWorkloads: { updatePolicy: { updateMode: Initial } }
  - name: When a profile only sets allWorkloads it should pass
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        profiles:
        - name: base
          hostedClusters: { type: All }
          allWorkloads: { updatePolicy: { minReplicas: 1 } }
  - name: When a workload only sets updatePolicy it should pass
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        profiles:
        - name: base
          hostedClusters: { type: All }
          workloads:
          - resource: deployments
            name: kube-apiserver
            updatePolicy: { updateMode: "Off" }
  - name: When a workload only sets resourcePolicy it should pass
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        profiles:
