  # --- Name and spec ---
  - name: When the name is not cluster it should fail
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: default
      spec:
        profiles:
        - name: base
          hostedClusters: { type: All }
          allWorkloads: { updatePolicy: { updateMode: Initial } }
    expectedError: 'exactly one configuration may exist and must be named ''cluster'''
  - name: When spec is missing it should fail
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
    expectedError: 'spec: Required value'
  # --- hostedClusters ---
  - name: When hostedClusters type is missing it should fail
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        hostedClusters: {}
        profiles:
        - name: base
          hostedClusters: { type: All }
          allWorkloads: { updatePolicy: { updateMode: Initial } }
    expectedError: 'spec.hostedClusters.type: Required value'
  - name: When hostedClusters type is invalid it should fail
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        hostedClusters: { type: Some }
        profiles:
        - name: base
          hostedClusters: { type: All }
          allWorkloads: { updatePolicy: { updateMode: Initial } }
    expectedError: 'spec.hostedClusters.type: Unsupported value: "Some"'
  - name: When hostedClusters type is Selector without a selector it should fail
    initial: |
      apiVersion: scheduling.hypershift.openshift.io/v1alpha1
      kind: ControlPlaneVerticalAutoscalingConfiguration
      metadata:
        name: cluster
      spec:
        hostedClusters: { type: Selector }
        profiles:
        - name: base
